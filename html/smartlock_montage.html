<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  min-height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  background: #858585;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

/* =========================================================
   INDIVIDUAL SMART-LOCK TITLE + ACTION BUTTON
   Edit each product inside PRODUCT_CONTENT_SETTINGS below.
========================================================= */
.product-info {
  position: fixed;
  left: 50%;
  bottom: max(20px, calc(env(safe-area-inset-bottom) + 3.8vh));
  transform: translateX(-50%);
  width: min(90vw, 1080px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(12px, 1.8vh, 19px);
  text-align: center;
  z-index: 15;
  transition: opacity .18s ease, transform .18s ease;
}

.product-info.is-changing {
  opacity: 0;
  transform: translate(-50%, 8px);
}

.product-title {
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  max-width: 100%;
  font-size: clamp(18px, 2.25vw, 32px);
  font-weight: 700;
  letter-spacing: 0.11em;
  line-height: 1.2;
  text-align: center;
  text-transform: uppercase;
  text-shadow: 0 3px 16px rgba(0, 0, 0, 0.28);
  overflow-wrap: anywhere;
  text-wrap: balance;
  transform: translate(
    var(--product-title-offset-x, 0px),
    var(--product-title-offset-y, 0px)
  );
}

.product-action {
  display: inline-flex;
  min-width: 170px;
  min-height: 45px;
  padding: 12px 28px;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.82);
  border-radius: 999px;
  background: rgba(20, 20, 20, 0.64);
  color: #ffffff;
  font: 700 12px/1 Arial, Helvetica, sans-serif;
  letter-spacing: 0.15em;
  text-decoration: none;
  text-transform: uppercase;
  backdrop-filter: blur(8px);
  transform: translate(
    var(--product-button-offset-x, 0px),
    var(--product-button-offset-y, 0px)
  );
  transition: background .2s ease, border-color .2s ease, transform .2s ease;
}

.product-action:hover {
  border-color: #d4b06a;
  background: #d4b06a;
  color: #171717;
  transform: translate(
    var(--product-button-offset-x, 0px),
    calc(var(--product-button-offset-y, 0px) - 2px)
  );
}

.product-action:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 4px;
}


/* Premium carousel navigation buttons â€” protected from theme overrides */
.carousel-button {
  position: fixed !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  width: 62px !important;
  height: 62px !important;
  padding: 0 !important;
  border: 1px solid rgba(255,255,255,.42) !important;
  border-radius: 18px !important;
  background: linear-gradient(145deg, rgba(35,35,38,.88), rgba(8,8,10,.72)) !important;
  color: transparent !important;
  font-size: 0 !important;
  cursor: pointer !important;
  z-index: 20 !important;
  display: grid !important;
  place-items: center !important;
  overflow: hidden !important;
  isolation: isolate !important;
  -webkit-backdrop-filter: blur(14px) saturate(145%) !important;
  backdrop-filter: blur(14px) saturate(145%) !important;
  box-shadow:
    0 14px 34px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 0 0 1px rgba(212,176,106,.08) !important;
  transition:
    transform .24s cubic-bezier(.2,.8,.2,1),
    border-color .24s ease,
    background .24s ease,
    box-shadow .24s ease,
    opacity .38s ease,
    visibility .38s ease !important;
  user-select: none !important;
  -webkit-tap-highlight-color: transparent !important;
}

.carousel-button::after {
  content: "" !important;
  position: absolute !important;
  inset: 7px !important;
  z-index: -1 !important;
  border-radius: 12px !important;
  border: 1px solid rgba(212,176,106,.20) !important;
  background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,0)) !important;
  pointer-events: none !important;
}

.carousel-button::before {
  content: "" !important;
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  display: block !important;
  width: 13px !important;
  height: 13px !important;
  margin: 0 !important;
  box-sizing: border-box !important;
  border-top: 3px solid #ffffff !important;
  border-right: 3px solid #ffffff !important;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,.45)) !important;
  transition: border-color .24s ease, transform .24s ease !important;
}

#rotateLeft::before {
  transform: translate(-50%, -50%) rotate(-135deg) !important;
}

#rotateRight::before {
  transform: translate(-50%, -50%) rotate(45deg) !important;
}

.carousel-button:hover {
  border-color: rgba(212,176,106,.92) !important;
  background: linear-gradient(145deg, rgba(212,176,106,.98), rgba(153,112,48,.94)) !important;
  box-shadow:
    0 18px 40px rgba(0,0,0,.34),
    0 0 0 4px rgba(212,176,106,.13),
    inset 0 1px 0 rgba(255,255,255,.36) !important;
  transform: translateY(-50%) scale(1.07) !important;
}

.carousel-button:hover::before {
  border-color: #171717 !important;
}

.carousel-button:active {
  transform: translateY(-50%) scale(.94) !important;
}

.carousel-button:focus-visible {
  outline: 2px solid #ffffff !important;
  outline-offset: 4px !important;
}

#rotateLeft { left: 28px !important; }
#rotateRight { right: 28px !important; }

@media (max-width: 700px) {
  .carousel-button {
    top: 42% !important;
    width: 48px !important;
    height: 48px !important;
    border-radius: 14px !important;
  }
  .carousel-button::after { inset: 5px !important; border-radius: 10px !important; }
  .carousel-button::before { width: 10px !important; height: 10px !important; border-width: 2.5px !important; }
  #rotateLeft { left: max(10px, env(safe-area-inset-left)) !important; }
  #rotateRight { right: max(10px, env(safe-area-inset-right)) !important; }
  .product-info {
    bottom: max(16px, calc(env(safe-area-inset-bottom) + 2.5vh));
    width: min(94vw, 480px);
    gap: 11px;
    padding: 0 10px;
  }
  .product-title {
    font-size: clamp(14px, 4.05vw, 19px);
    letter-spacing: 0.065em;
    line-height: 1.3;
  }
  .product-action {
    min-width: 146px;
    min-height: 44px;
    padding: 11px 20px;
    font-size: 11px;
  }
}

@media (max-width: 390px) {
  .carousel-button {
    top: 40% !important;
    width: 42px !important;
    height: 42px !important;
    border-radius: 12px !important;
  }
  #rotateLeft { left: 7px !important; }
  #rotateRight { right: 7px !important; }
  .product-info {
    width: 96vw;
    gap: 9px;
    padding: 0 8px;
  }
  .product-title {
    font-size: clamp(12px, 3.85vw, 15px);
    letter-spacing: 0.045em;
  }
  .product-action {
    min-width: 132px;
    min-height: 40px;
    font-size: 10px;
  }
}

@media (max-height: 520px) and (orientation: landscape) {
  .carousel-button { top: 43% !important; }
  .product-info {
    bottom: max(8px, env(safe-area-inset-bottom));
    gap: 6px;
  }
  .product-title {
    font-size: clamp(12px, 2vw, 18px);
    line-height: 1.15;
  }
  .product-action {
    min-height: 34px;
    padding: 8px 18px;
    font-size: 10px;
  }
}

/* =========================================================
   BASE64 PRODUCT PAGE â€” FULL-SCREEN FADE TRANSITION
   The carousel fades out before the P06 page fades in.
========================================================= */
body > canvas,
.carousel-button,
.product-info {
  transition: opacity .38s ease, visibility .38s ease, transform .2s ease;
}

body.detail-view-open > canvas,
body.detail-view-open .carousel-button,
body.detail-view-open .product-info {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.detail-viewer {
  position: fixed;
  inset: 0;
  z-index: 1000;
  width: 100%;
  height: 100%;
  background: #858585;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .42s ease, visibility .42s ease;
}

.detail-viewer.is-open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.detail-viewer__frame {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #858585;
}

.detail-viewer__close {
  position: fixed !important;
  top: max(18px, calc(env(safe-area-inset-top) + 12px)) !important;
  right: max(18px, calc(env(safe-area-inset-right) + 12px)) !important;
  z-index: 2 !important;
  min-width: 112px !important;
  min-height: 44px !important;
  padding: 11px 18px !important;
  border: 1px solid rgba(255,255,255,.72) !important;
  border-radius: 999px !important;
  background: rgba(15,15,15,.78) !important;
  color: #fff !important;
  font: 700 11px/1 Arial, Helvetica, sans-serif !important;
  letter-spacing: .12em !important;
  text-transform: uppercase !important;
  cursor: pointer !important;
  backdrop-filter: blur(10px) !important;
  transition: background .2s ease, color .2s ease, transform .2s ease !important;
}

.detail-viewer__close:hover {
  background: #d4b06a !important;
  color: #15120e !important;
  transform: translateY(-2px) !important;
}

body.detail-view-open {
  overflow: hidden;
}

@media (max-width:700px) {
  .detail-viewer__close {
    min-width: 92px !important;
    min-height: 40px !important;
    padding: 10px 14px !important;
    font-size: 10px !important;
  }
}

</style>

{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";

/* =========================================================
   SCENE
========================================================= */

const scene=new THREE.Scene();
// Warm gallery fallback behind the generated showroom backdrop.
scene.background=new THREE.Color(0xe7e1d7);

const camera=new THREE.PerspectiveCamera(
  38,
  innerWidth/innerHeight,
  0.1,
  100
);

/* =========================================================
   DEFAULT CAMERA VIEW Ã¢â‚¬â€ EDIT HERE
   =========================================================

   This view is used for the initial page-load camera angle.

   X = left / right side angle
   Y = camera height
   Z = camera distance

   CAMERA DISTANCE Ã¢â‚¬â€ CHANGE THE THIRD NUMBER BELOW:
   Larger Z = camera farther away / product appears smaller.
   Smaller Z = camera closer / product appears larger.

   Desktop camera distance: camera.z = 25
   Tablet camera distance: tabletCamera.z = 25.5
   Mobile camera distance: mobileCamera.z = 26

   Each device also uses a separate field of view and target so
   the smart lock stays above its responsive title and button.

   productRotationY:
   negative = rotate product slightly left
   positive = rotate product slightly right
========================================================= */

const DEFAULT_VIEW_SETTINGS={
  camera:new THREE.Vector3(
    0,    // <<< CAMERA X: centered for a straight front view
    5,    // <<< DESKTOP CAMERA HEIGHT Ã¢â‚¬â€ your preferred angle
    25    // <<< DESKTOP CAMERA DISTANCE Ã¢â‚¬â€ your preferred size
  ),

  tabletCamera:new THREE.Vector3(
    0,    // <<< TABLET CAMERA X
    4.9,  // <<< TABLET CAMERA HEIGHT
    25.5  // <<< TABLET CAMERA DISTANCE
  ),

  mobileCamera:new THREE.Vector3(
    0,    // <<< MOBILE CAMERA X: centered
    5.05, // <<< MOBILE CAMERA HEIGHT: matches the desktop viewing angle
    26    // <<< MOBILE CAMERA DISTANCE: increase for smaller mobile product
  ),

  target:new THREE.Vector3(
    0,      // <<< TARGET X: keep 0 to center the product
    2.55,   // <<< TARGET Y: vertical center
    0       // <<< TARGET Z
  ),

  tabletTarget:new THREE.Vector3(0,2.45,0),
  mobileTarget:new THREE.Vector3(0,2.4,0),
  desktopFieldOfView:36,
  tabletFieldOfView:38,
  mobileFieldOfView:40,

  // Move the entire smart lock AND podium independently by device.
  desktopCarouselHeight:1,   // <<< DESKTOP: preserves your current position
  tabletCarouselHeight:0.85, // <<< TABLET: whole product + podium height
  mobileCarouselHeight:0.7,  // <<< MOBILE: whole product + podium height

  productRotationY:0 // <<< PRODUCT ANGLE: 0 keeps the featured front lock facing straight forward
};

function getResponsiveView(){
  const isMobile=window.matchMedia("(max-width:700px)").matches;
  const isTablet=window.matchMedia("(max-width:1024px)").matches;
  const isShortLandscape=innerHeight<=520 && innerWidth>innerHeight;

  if(isMobile){
    const cameraPosition=DEFAULT_VIEW_SETTINGS.mobileCamera.clone();

    // Add breathing room for particularly narrow phones.
    if(innerWidth<=390) cameraPosition.z+=1.35;

    // Short portrait screens need a little extra space above the title.
    if(innerHeight<=680) cameraPosition.z+=0.75;

    return {
      position:cameraPosition,
      target:DEFAULT_VIEW_SETTINGS.mobileTarget,
      fieldOfView:isShortLandscape
        ? 46
        : DEFAULT_VIEW_SETTINGS.mobileFieldOfView
    };
  }

  if(isTablet || isShortLandscape){
    return {
      position:DEFAULT_VIEW_SETTINGS.tabletCamera,
      target:DEFAULT_VIEW_SETTINGS.tabletTarget,
      fieldOfView:isShortLandscape
        ? 44
        : DEFAULT_VIEW_SETTINGS.tabletFieldOfView
    };
  }

  return {
    position:DEFAULT_VIEW_SETTINGS.camera,
    target:DEFAULT_VIEW_SETTINGS.target,
    fieldOfView:DEFAULT_VIEW_SETTINGS.desktopFieldOfView
  };
}

function getResponsiveCarouselHeight(){
  if(window.matchMedia("(max-width:700px)").matches){
    return DEFAULT_VIEW_SETTINGS.mobileCarouselHeight;
  }

  if(window.matchMedia("(max-width:1024px)").matches){
    return DEFAULT_VIEW_SETTINGS.tabletCarouselHeight;
  }

  return DEFAULT_VIEW_SETTINGS.desktopCarouselHeight;
}

const initialView=getResponsiveView();
camera.position.copy(initialView.position);
camera.fov=initialView.fieldOfView;
camera.updateProjectionMatrix();

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=false;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;

document.body.appendChild(renderer.domElement);

/* =========================================================
   CONTROLS
========================================================= */

const controls=new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping=false;
controls.enableRotate=false;
controls.enablePan=false;
controls.enableZoom=false;
controls.enabled=false;
controls.target.copy(initialView.target);
controls.update();

/* =========================================================
   ZOOM SETTINGS Ã¢â‚¬â€ EDIT THESE VALUES
========================================================= */

const ZOOM_SETTINGS={
  closestDistance:2.35, // lower value = stronger manual zoom-in
  farthestDistance:13,
  wheelSpeed:1.35       // higher value = faster scroll zoom
};

controls.minDistance=ZOOM_SETTINGS.closestDistance;
controls.maxDistance=ZOOM_SETTINGS.farthestDistance;
controls.zoomSpeed=ZOOM_SETTINGS.wheelSpeed;

/* =========================================================
   HELPERS
========================================================= */

function addMesh(
  geometry,
  material,
  parent=scene,
  shadows=true
){
  const object=new THREE.Mesh(
    geometry,
    material
  );

  object.castShadow=shadows;
  object.receiveShadow=shadows;

  parent.add(object);

  return object;
}

function addCylinder({
  radius=0.2,
  radiusTop=radius,
  radiusBottom=radius,
  height=1,
  material,
  parent=scene,
  position=[0,0,0],
  rotation=[0,0,0],
  segments=72
}){
  const object=addMesh(
    new THREE.CylinderGeometry(
      radiusTop,
      radiusBottom,
      height,
      segments
    ),
    material,
    parent
  );

  object.position.set(...position);
  object.rotation.set(...rotation);

  return object;
}

function roundedRectGeometry(
  width,
  height,
  depth,
  radius
){
  const shape=new THREE.Shape();

  shape.moveTo(
    -width/2+radius,
    -height/2
  );

  shape.lineTo(
    width/2-radius,
    -height/2
  );

  shape.quadraticCurveTo(
    width/2,
    -height/2,
    width/2,
    -height/2+radius
  );

  shape.lineTo(
    width/2,
    height/2-radius
  );

  shape.quadraticCurveTo(
    width/2,
    height/2,
    width/2-radius,
    height/2
  );

  shape.lineTo(
    -width/2+radius,
    height/2
  );

  shape.quadraticCurveTo(
    -width/2,
    height/2,
    -width/2,
    height/2-radius
  );

  shape.lineTo(
    -width/2,
    -height/2+radius
  );

  shape.quadraticCurveTo(
    -width/2,
    -height/2,
    -width/2+radius,
    -height/2
  );

  const geometry=new THREE.ExtrudeGeometry(
    shape,
    {
      depth,
      bevelEnabled:false
    }
  );

  geometry.center();

  return geometry;
}

function addRoundedBox({
  size=[1,1,1],
  radius=0.1,
  material,
  parent=scene,
  position=[0,0,0],
  rotation=[0,0,0]
}){
  const object=addMesh(
    roundedRectGeometry(
      size[0],
      size[1],
      size[2],
      radius
    ),
    material,
    parent
  );

  object.position.set(...position);
  object.rotation.set(...rotation);

  return object;
}

function createPanelIcon(
  value,
  {
    fontSize=64,
    color="#ffffff",
    width=128,
    height=128,
    iconType="text"
  }={}
){
  const canvas=document.createElement("canvas");
  const context=canvas.getContext("2d");

  canvas.width=width;
  canvas.height=height;

  context.clearRect(0,0,width,height);
  context.strokeStyle=color;
  context.fillStyle=color;
  context.lineWidth=Math.max(4,width*0.055);
  context.lineCap="round";
  context.lineJoin="round";

  if(iconType==="bell"){
    const cx=width/2;
    const cy=height/2+3;
    const bellWidth=width*0.34;
    const bellHeight=height*0.34;

    context.beginPath();
    context.moveTo(cx-bellWidth/2,cy+bellHeight*0.25);
    context.quadraticCurveTo(
      cx-bellWidth*0.46,
      cy-bellHeight*0.52,
      cx,
      cy-bellHeight*0.58
    );
    context.quadraticCurveTo(
      cx+bellWidth*0.46,
      cy-bellHeight*0.52,
      cx+bellWidth/2,
      cy+bellHeight*0.25
    );
    context.lineTo(cx+bellWidth*0.62,cy+bellHeight*0.42);
    context.lineTo(cx-bellWidth*0.62,cy+bellHeight*0.42);
    context.closePath();
    context.stroke();

    context.beginPath();
    context.arc(cx,cy-bellHeight*0.68,width*0.035,0,Math.PI*2);
    context.fill();

    context.beginPath();
    context.arc(cx,cy+bellHeight*0.53,width*0.055,0,Math.PI);
    context.stroke();
  }else if(iconType==="card"){
    const cardWidth=width*0.48;
    const cardHeight=height*0.32;
    const x=(width-cardWidth)/2;
    const y=(height-cardHeight)/2;
    const radius=width*0.055;

    context.beginPath();
    context.roundRect(x,y,cardWidth,cardHeight,radius);
    context.stroke();

    context.beginPath();
    context.moveTo(x+cardWidth*0.12,y+cardHeight*0.35);
    context.lineTo(x+cardWidth*0.88,y+cardHeight*0.35);
    context.stroke();

    context.beginPath();
    context.moveTo(x+cardWidth*0.15,y+cardHeight*0.72);
    context.lineTo(x+cardWidth*0.42,y+cardHeight*0.72);
    context.stroke();
  }else{
    context.font=`600 ${fontSize}px Arial`;
    context.textAlign="center";
    context.textBaseline="middle";
    context.fillText(value,width/2,height/2);
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.needsUpdate=true;

  const icon=new THREE.Mesh(
    new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({
      map:texture,
      transparent:true,
      depthWrite:false,
      side:THREE.DoubleSide,
      toneMapped:false
    })
  );

  icon.castShadow=false;
  icon.receiveShadow=false;

  return icon;
}

/* =========================================================
   MATERIALS Ã¢â‚¬â€ REFERENCE-MATCHED GRAPHITE + BLACK GLASS
========================================================= */

const matteBlack=new THREE.MeshPhysicalMaterial({
  color:0x474646,
  metalness:0.48,
  roughness:0.46,
  clearcoat:0.13,
  clearcoatRoughness:0.4,
  sheen:0.08,
  sheenColor:new THREE.Color(0x555555),
  envMapIntensity:0.92
});

const rearCoverMaterial=new THREE.MeshPhysicalMaterial({
  color:0x303030,
  metalness:0.34,
  roughness:0.54,
  clearcoat:0.08,
  clearcoatRoughness:0.5,
  envMapIntensity:0.72
});

const edgeBlack=new THREE.MeshPhysicalMaterial({
  color:0x0d0d0e,
  metalness:0.72,

const BACKGROUND_SETTINGS={
  topColor:"#f4f1eb",
  middleColor:"#ddd6ca",
  bottomColor:"#bcb1a3",
  centerGlow:"rgba(255,255,255,0.72)",
  sideShade:"rgba(88,78,66,0.13)",
  panelLight:"rgba(255,255,255,0.32)",
  panelShade:"rgba(90,78,66,0.10)",
  goldLine:"rgba(176,132,65,0.72)"
};

function createLuxuryShowroomTexture(size=2048){
  const canvas=document.createElement("canvas");
  canvas.width=size;
  canvas.height=size;

  const context=canvas.getContext("2d");

  // Warm ivory-to-greige gallery gradient.
  const baseGradient=context.createLinearGradient(0,0,0,size);
  baseGradient.addColorStop(0,BACKGROUND_SETTINGS.topColor);
  baseGradient.addColorStop(0.58,BACKGROUND_SETTINGS.middleColor);
  baseGradient.addColorStop(1,BACKGROUND_SETTINGS.bottomColor);
  context.fillStyle=baseGradient;
  context.fillRect(0,0,size,size);

  // Bright central spotlight creates contrast around the black smart lock.
  const centerHalo=context.createRadialGradient(
    size*0.50,size*0.42,0,
    size*0.50,size*0.42,size*0.40
  );
  centerHalo.addColorStop(0,BACKGROUND_SETTINGS.centerGlow);
  centerHalo.addColorStop(0.54,"rgba(255,255,255,0.20)");
  centerHalo.addColorStop(1,"rgba(255,255,255,0)");
  context.fillStyle=centerHalo;
  context.fillRect(0,0,size,size);

  // Fluted wall panels on both sides.
  context.lineWidth=Math.max(2,size*0.0011);
  for(let xPosition=0.055;xPosition<=0.285;xPosition+=0.023){
    context.strokeStyle=
      Math.round(xPosition*1000)%2===0
        ? BACKGROUND_SETTINGS.panelLight
        : BACKGROUND_SETTINGS.panelShade;
    context.beginPath();
    context.moveTo(size*xPosition,size*0.05);
    context.lineTo(size*xPosition,size*0.88);
    context.stroke();
  }
  for(let xPosition=0.715;xPosition<=0.945;xPosition+=0.023){
    context.strokeStyle=
      Math.round(xPosition*1000)%2===0
        ? BACKGROUND_SETTINGS.panelLight
        : BACKGROUND_SETTINGS.panelShade;
    context.beginPath();
    context.moveTo(size*xPosition,size*0.05);
    context.lineTo(size*xPosition,size*0.88);
    context.stroke();
  }

  // Large champagne-gold architectural arch behind the center product.
  context.lineWidth=Math.max(5,size*0.0030);
  context.strokeStyle=BACKGROUND_SETTINGS.goldLine;
  context.beginPath();
  context.moveTo(size*0.31,size*0.86);
  context.lineTo(size*0.31,size*0.48);
  context.bezierCurveTo(
    size*0.31,size*0.20,
    size*0.69,size*0.20,
    size*0.69,size*0.48
  );
  context.lineTo(size*0.69,size*0.86);
  context.stroke();

  // Fine inner arch adds layered depth.
  context.lineWidth=Math.max(2,size*0.0012);
  context.strokeStyle="rgba(255,255,255,0.52)";
  context.beginPath();
  context.moveTo(size*0.335,size*0.86);
  context.lineTo(size*0.335,size*0.49);
  context.bezierCurveTo(
    size*0.335,size*0.245,
    size*0.665,size*0.245,
    size*0.665,size*0.49
  );
  context.lineTo(size*0.665,size*0.86);
  context.stroke();

  // Soft champagne horizon line separates the wall and floor.
  const horizon=context.createLinearGradient(0,0,size,0);
  horizon.addColorStop(0,"rgba(176,132,65,0)");
  horizon.addColorStop(0.20,"rgba(176,132,65,0.24)");
  horizon.addColorStop(0.50,"rgba(176,132,65,0.56)");
  horizon.addColorStop(0.80,"rgba(176,132,65,0.24)");
  horizon.addColorStop(1,"rgba(176,132,65,0)");
  context.fillStyle=horizon;
  context.fillRect(0,size*0.855,size,Math.max(3,size*0.0018));

  // Gentle side shading keeps the layout dimensional without becoming dark.
  [0,1].forEach(side=>{
    const x=side===0 ? 0 : size;
    const edgeShade=context.createLinearGradient(
      x,0,
      side===0 ? size*0.22 : size*0.78,
      0
    );
    edgeShade.addColorStop(0,BACKGROUND_SETTINGS.sideShade);
    edgeShade.addColorStop(1,"rgba(0,0,0,0)");
    context.fillStyle=edgeShade;
    context.fillRect(0,0,size,size);
  });

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.minFilter=THREE.LinearFilter;
  texture.magFilter=THREE.LinearFilter;
  texture.needsUpdate=true;
  return texture;
}

/*
  Creates a smooth vertex-color gradient while keeping
  MeshStandardMaterial lighting, so the walls/floor still react
  naturally to the studio lights.
*/
function createGradientPlaneGeometry(
  width,
  height,
  topColor,
  bottomColor,
  middleColor=null
){
  const geometry=new THREE.PlaneGeometry(
    width,
    height,
    1,
    middleColor ? 2 : 1
  );

  const positions=geometry.attributes.position;
  const colors=[];

  const top=new THREE.Color(topColor);
  const bottom=new THREE.Color(bottomColor);
  const middle=middleColor
    ? new THREE.Color(middleColor)
    : null;

  for(let index=0;index<positions.count;index++){
    const localY=positions.getY(index);
    const normalized=(localY+height/2)/height;

    let color;

    if(middle){
      if(normalized<=0.5){
        const t=normalized/0.5;
        color=bottom.clone().lerp(middle,t);
      }else{
        const t=(normalized-0.5)/0.5;
        color=middle.clone().lerp(top,t);
      }
    }else{
      color=bottom.clone().lerp(top,normalized);
    }

    colors.push(color.r,color.g,color.b);
  }

  geometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(colors,3)
  );

  return geometry;
}

function createRadialGlowTexture({
  size=1024,
  innerColor="rgba(255,220,150,0.28)",
  middleColor="rgba(255,210,120,0.12)",
  outerColor="rgba(255,210,120,0)"
}={}){
  const canvas=document.createElement("canvas");
  canvas.width=size;
  canvas.height=size;

  const ctx=canvas.getContext("2d");
  const gradient=ctx.createRadialGradient(
    size/2,size/2,size*0.05,
    size/2,size/2,size*0.5
  );
  gradient.addColorStop(0,innerColor);
  gradient.addColorStop(0.42,middleColor);
  gradient.addColorStop(1,outerColor);

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,size,size);

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.needsUpdate=true;
  return texture;
}

/* =========================================================

   The actual position is set later in cardReaderIcon.position.
   Current local Y = 2.86

   2.86 = exactly between keypad number 5 and keypad number 8
   Higher number = move SMART CARD upward
   Lower number  = move SMART CARD downward
   ========================================================= */

const keypadGroup=new THREE.Group();
keypadGroup.position.set(
  KEYPAD_SETTINGS.position.x,
  1.3,
  KEYPAD_SETTINGS.position.z
);

keypadGroup.scale.setScalar(KEYPAD_SETTINGS.scale);

const keypadValues=[
  "1","2","3",
  "4","5","6",
  "7","8","9",
  "*","0","bell"
];

const keyColumns=[
  -KEYPAD_SETTINGS.columnSpacing,
  0,
  KEYPAD_SETTINGS.columnSpacing
];

const keyRows=[
  3.34,
  3.34-KEYPAD_SETTINGS.rowSpacing,
  3.34-KEYPAD_SETTINGS.rowSpacing*2,
  3.34-KEYPAD_SETTINGS.rowSpacing*3
];

let keyIndex=0;

for(let row=0;row<4;row++){
  for(let column=0;column<3;column++){
    const keyValue=keypadValues[keyIndex++];

    const key=createPanelIcon(
      keyValue,
      {
        fontSize:50,
        width:96,
        height:96,
        iconType:keyValue==="bell" ? "bell" : "text"
      }
    );

    key.position.set(
      keyColumns[column],
      keyRows[row],
      0
    );

    const keySize=keyValue==="bell"
      ? KEYPAD_SETTINGS.bellScale
      : KEYPAD_SETTINGS.keyScale;

    key.scale.set(keySize,keySize,1);
    keypadGroup.add(key);
  }
}

/* =========================================================
   RIGHT-SIDE REFERENCE SMART LOCK
========================================================= */
function fullyRoundedRectGeometry(
  width,
  height,
  depth,
  radius,
  edgeRadius=0.012,
  bevelSegments=8
){
  /* Keep the bevel safely inside very thin panels. */
  const edge=Math.min(
    edgeRadius,
    width*0.20,
    height*0.20,
    depth*0.45
  );

  /* Inset the 2D profile by the bevel amount so the FINAL
     outside width/height stays equal to the requested size. */
  const innerWidth=Math.max(0.001,width-edge*2);
  const innerHeight=Math.max(0.001,height-edge*2);
  const innerDepth=Math.max(0.001,depth-edge*2);

  const maxRadius=Math.max(
    0.001,
    Math.min(innerWidth,innerHeight)/2-0.001
  );

  const innerRadius=Math.max(
    0.001,
    Math.min(radius-edge,maxRadius)
  );

  const shape=new THREE.Shape();

  shape.moveTo(-innerWidth/2+innerRadius,-innerHeight/2);
  shape.lineTo(innerWidth/2-innerRadius,-innerHeight/2);
  shape.quadraticCurveTo(
    innerWidth/2,-innerHeight/2,
    innerWidth/2,-innerHeight/2+innerRadius
  );

  shape.lineTo(innerWidth/2,innerHeight/2-innerRadius);
  shape.quadraticCurveTo(
    innerWidth/2,innerHeight/2,
    innerWidth/2-innerRadius,innerHeight/2
  );

  shape.lineTo(-innerWidth/2+innerRadius,innerHeight/2);
  shape.quadraticCurveTo(
    -innerWidth/2,innerHeight/2,
    -innerWidth/2,innerHeight/2-innerRadius
  );

  shape.lineTo(-innerWidth/2,-innerHeight/2+innerRadius);
  shape.quadraticCurveTo(
    -innerWidth/2,-innerHeight/2,
    -innerWidth/2+innerRadius,-innerHeight/2
  );
  shape.closePath();

  const geometry=new THREE.ExtrudeGeometry(shape,{
    depth:innerDepth,
    bevelEnabled:true,
    bevelThickness:edge,
    bevelSize:edge,
    bevelOffset:0,
    bevelSegments,
    curveSegments:24,
    steps:1
  });

  geometry.center();
  geometry.computeVertexNormals();

  return geometry;
}

   ADD FULLY ROUNDED 3D PANEL
   ========================================================= */
function addFullyRoundedBox({

/* =========================================================
   HANDLE WITH INNER / CONCAVE LEFT SIDE
   ---------------------------------------------------------
   innerCurve  = how deep the LEFT side curves inward
   rightRadius = roundness of the RIGHT end
   ========================================================= */
/* =========================================================
   HANDLE WITH CLEAN ")" INNER CURVE ON LEFT
   ========================================================= */
function innerCurvedHandleGeometry({
  width=2.18,
  height=0.32,
  depth=0.10,
  innerCurve=0.12,
  rightRadius=0.13,
  edgeRadius=0.018,
  bevelSegments=48
}={}){

  const shape=new THREE.Shape();

  const left   = -width/2;
  const right  =  width/2;
  const top    =  height/2;
  const bottom = -height/2;

  const r=Math.min(rightRadius,height/2);

  /* START EXACTLY AT FULL LEFT/TOP */
  shape.moveTo(left,top);

  /* TOP EDGE */
  shape.lineTo(right-r,top);

  /* TOP-RIGHT ROUND CORNER */
  shape.quadraticCurveTo(
    right,top,
    right,top-r
  );

  /* RIGHT EDGE */
  shape.lineTo(right,bottom+r);

  /* BOTTOM-RIGHT ROUND CORNER */
  shape.quadraticCurveTo(
    right,bottom,
    right-r,bottom
  );

  /* BOTTOM EDGE GOES ALL THE WAY TO LEFT */
  shape.lineTo(left,bottom);

  /* =====================================================
     PROPORTIONAL INWARD CURVE ON LEFT

     IMPORTANT:
     Top-left  = full height
     Bottom-left = full height
     Only middle curves inward
     ===================================================== */
  shape.bezierCurveTo(
    left + innerCurve, bottom,
    left + innerCurve, top,
    left, top
  );

  shape.closePath();


  const bevel=Math.min(
    edgeRadius,
    depth*0.40,
    height*0.10
  );

  const geometry=new THREE.ExtrudeGeometry(shape,{
    depth:Math.max(0.001,depth-bevel*2),
    bevelEnabled:true,
    bevelThickness:bevel,
    bevelSize:bevel,
    bevelOffset:0,
    bevelSegments:bevelSegments,
    curveSegments:64,
    steps:1
  });

  geometry.center();
  geometry.computeVertexNormals();

  return geometry;
}

}

function createRearBlackCurvedFaceGeometry(){
  const width=REAR_FACE_SETTINGS.blackPanelWidth;
  const topY=REAR_FACE_SETTINGS.blackTopY;
  const curveStartY=REAR_FACE_SETTINGS.blackCurveStartY;
  const topCornerRadius=REAR_FACE_SETTINGS.blackTopCornerRadius;
  const bottomCurveRadius=REAR_FACE_SETTINGS.blackBottomCurveRadius;
  const bottomY=curveStartY-bottomCurveRadius;
  const depth=REAR_FACE_SETTINGS.blackCurveDepth;
  const bevelSize=REAR_FACE_SETTINGS.blackCurveBevel;
  const bevelSegments=REAR_FACE_SETTINGS.blackCurveBevelSegments;
  const curveSegments=REAR_FACE_SETTINGS.blackCurveSegments;

  const left=-width/2;
  const right=width/2;
  const k=0.5522847498;

  const horizontalRadius=width/2;
  const verticalRadius=bottomCurveRadius;

  const shape=new THREE.Shape();

  shape.moveTo(left,curveStartY);

  shape.lineTo(
    left,
    topY-topCornerRadius
  );

  shape.quadraticCurveTo(
    left,
    topY,
    left+topCornerRadius,
    topY
  );

  shape.lineTo(
    right-topCornerRadius,
    topY
  );

  shape.quadraticCurveTo(
    right,
    topY,
    right,
    topY-topCornerRadius
  );

  shape.lineTo(
    right,
    curveStartY
  );

  shape.bezierCurveTo(
    right,
    curveStartY-(k*verticalRadius),
    k*horizontalRadius,
    bottomY,
    0,
    bottomY
  );

  shape.bezierCurveTo(
    -k*horizontalRadius,
    bottomY,
    left,
    curveStartY-(k*verticalRadius),
    left,
    curveStartY
  );

  shape.closePath();

  const safeBevel=Math.min(
    bevelSize,
    depth*0.42
  );

  const geometry=new THREE.ExtrudeGeometry(
    shape,
    {
      depth:Math.max(
        0.002,
        depth-safeBevel*2
      ),
      bevelEnabled:true,
      bevelThickness:safeBevel,
      bevelSize:safeBevel,
      bevelOffset:0,
      bevelSegments,
      curveSegments,
      steps:1
    }
  );

  geometry.center();
  geometry.computeVertexNormals();

  return geometry;
}

function createFrontBlackCurvedFaceGeometry(){
  const width = 0.8;              // <<< BLACK PANEL WIDTH
  const topY = 5;                // <<< TOP POSITION
  const curveStartY = 1.86;         // <<< WHERE BOTTOM CURVE STARTS
  const topCornerRadius = 0.2;    // <<< TOP LEFT/RIGHT CORNER RADIUS
  const bottomCurveRadius = 0.38;   // <<< MAIN BOTTOM CURVE RADIUS
  const bottomY = curveStartY - bottomCurveRadius;
  const depth = 0.01;              // <<< PANEL THICKNESS
  const bevelSize = 0.007;          // <<< EDGE ROUNDNESS
  const bevelSegments = 10;         // <<< EDGE SMOOTHNESS
  const curveSegments = 64;         // <<< BOTTOM CURVE SMOOTHNESS
  const left = -width / 2;
  const right = width / 2;
  const k = 0.5522847498;
  const horizontalRadius = width / 2;
  const verticalRadius = bottomCurveRadius;
  const shape = new THREE.Shape();
  shape.moveTo(
    left,
    curveStartY
  );
  shape.lineTo(
    left,
    topY - topCornerRadius
  );
  shape.quadraticCurveTo(
    left,
    topY,

    left + topCornerRadius,
    topY
  );
  shape.lineTo(
    right - topCornerRadius,
    topY
  );
  shape.quadraticCurveTo(
    right,
    topY,

    right,
    topY - topCornerRadius
  );
  shape.lineTo(
    right,
    curveStartY
  );
  shape.bezierCurveTo(

    right,
    curveStartY - (k * verticalRadius),

    k * horizontalRadius,
    bottomY,

    0,
    bottomY
  );
  shape.bezierCurveTo(

    -k * horizontalRadius,
    bottomY,

    left,
    curveStartY - (k * verticalRadius),

    left,
    curveStartY
  );
  shape.closePath();
  const safeBevel = Math.min(
    bevelSize,
    depth * 0.42
  );
  const geometry = new THREE.ExtrudeGeometry(
    shape,
    {
      depth: Math.max(
        0.002,
        depth - safeBevel * 2
      ),
      bevelEnabled: true,
      bevelThickness: safeBevel,
      bevelSize: safeBevel,
      bevelOffset: 0,
      bevelSegments: bevelSegments,
      curveSegments: curveSegments,
      steps: 1
    }
  );
  geometry.center();
  geometry.computeVertexNormals();
  return geometry;
}

/* =========================================================
   BASE64 PRODUCT EMBEDDING
   ---------------------------------------------------------
   Each carousel item contains an embedded Base64 instruction.
   The instruction decodes to the original Three.js clone call,
   so the product geometry, materials, textures, proportions,
   keypad, handles, and all other design details remain unchanged.
========================================================= */

const PRODUCT_BASE64_CODES=[
  "cmV0dXJuIHNvdXJjZUxvY2suY2xvbmUodHJ1ZSk7",
  "cmV0dXJuIHNvdXJjZUxvY2suY2xvbmUodHJ1ZSk7",
  "cmV0dXJuIHNvdXJjZUxvY2suY2xvbmUodHJ1ZSk7",
  "cmV0dXJuIHNvdXJjZUxvY2suY2xvbmUodHJ1ZSk7"
];

function createProductFromBase64(base64Code,sourceLock){
  const decodedCode=atob(base64Code);
  const createProduct=new Function("sourceLock",decodedCode);
  return createProduct(sourceLock);
}

/*
  Different smart-lock models have different body heights and local origins.
  Measure the real bottom of each model so every product has the same visible
  floating gap above its podium, including the taller center smart lock.
*/
function getProductFloatingBaseY(product){
  const productBounds=new THREE.Box3().setFromObject(product);

  // Product 03 intentionally has no model, so keep its placeholder harmless.
  if(productBounds.isEmpty()) return automaticProductY;

  const productBottomLocal=productBounds.min.y-product.position.y;

  return (
    PRODUCT_SETTINGS.stageTopY+
    CAROUSEL_SETTINGS.productBottomClearance-
    productBottomLocal
  );
}

for(let index=0;index<CAROUSEL_SETTINGS.count;index++){
  const angle=index*CAROUSEL_SETTINGS.rotationStep;
  const carouselLock=
    index===2
      // Product 03 is unfinished. Keep an empty group so its podium,
      // carousel position, title and button remain fully functional.
      ? new THREE.Group()
      : index===1
        ? createRightReferenceProduct()
        : index===3
          ? createLeftReferenceProduct()
          : createProductFromBase64(PRODUCT_BASE64_CODES[index],lock);
          const SMARTLOCK_SIZE_SETTINGS = [
            1.1, // First smart lock
            1.1, // Second smart lock
            1.1, // Empty podium
            1.1  // Fourth smart lock
          ];
          carouselLock.scale.setScalar(SMARTLOCK_SIZE_SETTINGS[index]);

  const x=Math.sin(angle)*CAROUSEL_SETTINGS.radius;
  const z=Math.cos(angle)*CAROUSEL_SETTINGS.radius;

  // Create one complete podium directly below this smart lock.
  const podiumData=createPodium(carouselGroup,x,z);
  carouselPodiums.push(podiumData);

  const floatingBaseY=getProductFloatingBaseY(carouselLock);

  carouselLock.position.set(
    x,
    floatingBaseY,
    z
  );

  // Each front panel faces outward. The featured lock at the front of the
  // carousel therefore faces the camera directly with no side angle.
  carouselLock.rotation.y=DEFAULT_VIEW_SETTINGS.productRotationY;
  carouselLock.userData.baseRotationY=DEFAULT_VIEW_SETTINGS.productRotationY;
  carouselLock.userData.floatingBaseY=floatingBaseY;

  carouselGroup.add(carouselLock);
  carouselLocks.push(carouselLock);
}

let carouselTargetRotation=CAROUSEL_SETTINGS.baseAngle;
let carouselCurrentRotation=CAROUSEL_SETTINGS.baseAngle;
let carouselIsAnimating=false;
let activeProductIndex=0;
let productInfoTransition=null;

const productInfo=document.getElementById("productInfo");
const productTitle=document.getElementById("productTitle");
const productAction=document.getElementById("productAction");
const detailViewer=document.getElementById("detailViewer");
const detailFrame=document.getElementById("detailFrame");
const detailClose=document.getElementById("detailClose");
const DETAIL_TRANSITION_SETTINGS={
  carouselFadeDuration:390, // <<< CAROUSEL FADE-OUT SPEED IN MILLISECONDS
  productFadeDuration:430   // <<< PRODUCT PAGE FADE-IN / FADE-OUT SPEED
};
let detailOpenTimer=null;
let detailCloseTimer=null;

function openProductDetails(product){
  if(!product?.detailBase64) return false;

  clearTimeout(detailOpenTimer);
  clearTimeout(detailCloseTimer);
  detailFrame.title=`${product.title} details`;

  // Remove the phone, smart-card/tag and physical-key image column.
  // Keep the complete 3D lock, specifications and montage untouched.
  const embeddedProductHtml=atob(product.detailBase64);
  const productHtmlWithoutAccessories=embeddedProductHtml.replace(
    /<div class="image-area">[\s\S]*?<\/div>\s*(?=<div class="ui">)/,
    ""
  );
  detailFrame.src=
    `data:text/html;base64,${btoa(productHtmlWithoutAccessories)}`;

  // First fade out the existing carousel, title and navigation controls.
  document.body.classList.add("detail-view-open");

  // Then fade in the complete Base64 P06 page across the entire viewport.
  detailOpenTimer=setTimeout(()=>{
    detailViewer.classList.add("is-open");
    detailViewer.setAttribute("aria-hidden","false");
    detailClose.focus({preventScroll:true});
  },DETAIL_TRANSITION_SETTINGS.carouselFadeDuration);

  return true;
}

function closeProductDetails(){
  clearTimeout(detailOpenTimer);
  detailViewer.classList.remove("is-open");
  detailViewer.setAttribute("aria-hidden","true");

  // Fade out the product page, then restore the original carousel display.
  clearTimeout(detailCloseTimer);
  detailCloseTimer=setTimeout(()=>{
    detailFrame.src="about:blank";
    document.body.classList.remove("detail-view-open");
    productAction.focus({preventScroll:true});
  },DETAIL_TRANSITION_SETTINGS.productFadeDuration);
}

productAction.addEventListener("click",event=>{
  const product=PRODUCT_CONTENT_SETTINGS[activeProductIndex];
  if(!product?.detailBase64) return;
  event.preventDefault();
  openProductDetails(product);
});

detailClose.addEventListener("click",closeProductDetails);

addEventListener("keydown",event=>{
  if(event.key==="Escape" && detailViewer.classList.contains("is-open")){
    closeProductDetails();
  }
});

function updateProductLabelPosition(){
  const isLandscape=innerHeight<=520 && innerWidth>innerHeight;
  const isSmallMobile=window.matchMedia("(max-width:390px)").matches;
  const isMobile=window.matchMedia("(max-width:700px)").matches;
  const isTablet=window.matchMedia("(max-width:1024px)").matches;

  const position=isLandscape
    ? PRODUCT_LABEL_POSITION_SETTINGS.landscape
    : isSmallMobile
      ? PRODUCT_LABEL_POSITION_SETTINGS.smallMobile
      : isMobile
        ? PRODUCT_LABEL_POSITION_SETTINGS.mobile
        : isTablet
          ? PRODUCT_LABEL_POSITION_SETTINGS.tablet
          : PRODUCT_LABEL_POSITION_SETTINGS.desktop;

  productInfo.style.left=`${position.xPercent}%`;
  productInfo.style.bottom=
    `max(${position.bottomVh}vh, calc(env(safe-area-inset-bottom) + ${position.minBottomPx}px))`;

  productTitle.style.setProperty(
    "--product-title-offset-x",
    `${position.titleX}px`
  );
  productTitle.style.setProperty(
    "--product-title-offset-y",
    `${position.titleY}px`
  );
  productAction.style.setProperty(
    "--product-button-offset-x",
    `${position.buttonX}px`
  );
  productAction.style.setProperty(
    "--product-button-offset-y",
    `${position.buttonY}px`
  );
}

function updateProductInfo(index,animateTransition=true){
  const product=PRODUCT_CONTENT_SETTINGS[index];
  if(!product) return;

  const applyProductContent=()=>{
    productTitle.textContent=product.title;
    productAction.textContent=product.buttonText;
    productAction.href=product.buttonLink;
    productAction.setAttribute(
      "aria-label",
      `${product.buttonText}: ${product.title}`
    );
    productInfo.classList.remove("is-changing");
  };

  clearTimeout(productInfoTransition);

  if(!animateTransition){
    applyProductContent();
    return;
  }

  productInfo.classList.add("is-changing");
  productInfoTransition=setTimeout(applyProductContent,180);
}

updateProductLabelPosition();
updateProductInfo(activeProductIndex,false);

function rotateCarousel(direction){
  if(carouselIsAnimating) return;
  carouselTargetRotation+=direction*CAROUSEL_SETTINGS.rotationStep;
  carouselIsAnimating=true;
  activeProductIndex=(
    activeProductIndex-direction+CAROUSEL_SETTINGS.count
  )%CAROUSEL_SETTINGS.count;
  updateProductInfo(activeProductIndex);
}


document.getElementById("rotateLeft").addEventListener("click",()=>{
  rotateCarousel(1);
});

document.getElementById("rotateRight").addEventListener("click",()=>{
  rotateCarousel(-1);
});

/* Swipe across the 3D product on phones and tablets. */
let swipeStartX=null;
let swipeStartY=null;

renderer.domElement.addEventListener("pointerdown",event=>{
  if(event.pointerType!=="touch") return;
  swipeStartX=event.clientX;
  swipeStartY=event.clientY;
});

renderer.domElement.addEventListener("pointerup",event=>{
  if(event.pointerType!=="touch" || swipeStartX===null) return;

  const distanceX=event.clientX-swipeStartX;
  const distanceY=event.clientY-swipeStartY;
  swipeStartX=null;
  swipeStartY=null;

  if(Math.abs(distanceX)<42 || Math.abs(distanceX)<=Math.abs(distanceY)){
    return;
  }

  rotateCarousel(distanceX>0 ? 1 : -1);
});

renderer.domElement.addEventListener("pointercancel",()=>{
  swipeStartX=null;
  swipeStartY=null;
});

addEventListener("keydown",event=>{
  if(event.key==="ArrowLeft") rotateCarousel(1);
  if(event.key==="ArrowRight") rotateCarousel(-1);
});

/* =========================================================
   PRODUCT-ONLY VIEW
   ---------------------------------------------------------
   Interactive smart-lock product with drag, zoom, rotation,
   and a gentle floating animation.
========================================================= */

function animate(time = 0) {
  requestAnimationFrame(animate);

  if (FLOATING_PRODUCT_SETTINGS.enabled) {
    const floatWave =
      Math.sin(time * FLOATING_PRODUCT_SETTINGS.speed);

    carouselLocks.forEach((carouselLock)=>{
      carouselLock.position.y =
        carouselLock.userData.floatingBaseY+
        floatWave*FLOATING_PRODUCT_SETTINGS.amplitude;
    });

    carouselPodiums.forEach((podiumData)=>{
      const podiumWave=floatWave;
      const podiumShadowScale=1.0-podiumWave*0.035;

      podiumData.shadowSoft.scale.set(
        podiumShadowScale,
        podiumShadowScale,
        1
      );
      podiumData.shadowCore.scale.set(
        podiumShadowScale,
        podiumShadowScale,
        1
      );

      podiumData.shadowSoft.material.opacity=1.08-podiumWave*0.10;
      podiumData.shadowCore.material.opacity=0.44-podiumWave*0.045;
    });
  } else {
    carouselLocks.forEach(carouselLock=>{
      carouselLock.position.y=carouselLock.userData.floatingBaseY;
    });
  }

  // Smoothly ease the whole carousel to the next 90-degree position.
  carouselCurrentRotation=THREE.MathUtils.lerp(
    carouselCurrentRotation,
    carouselTargetRotation,
    CAROUSEL_SETTINGS.animationSpeed
  );

  if(Math.abs(carouselTargetRotation-carouselCurrentRotation)<0.0005){
    carouselCurrentRotation=carouselTargetRotation;
    carouselIsAnimating=false;
  }

  carouselGroup.rotation.y=carouselCurrentRotation;

  /* Keep every smart lock facing front while their positions move
     around the carousel. This cancels the parent-group rotation
     on each child so all products stay front-facing to the viewer. */
  carouselLocks.forEach(carouselLock=>{
    const baseRotationY=carouselLock.userData.baseRotationY ?? 0;
    carouselLock.rotation.y=baseRotationY-carouselCurrentRotation;
  });

  renderer.render(scene, camera);
}

animate();

addEventListener("resize", () => {
  const responsiveView=getResponsiveView();

  camera.aspect=innerWidth/innerHeight;
  camera.fov=responsiveView.fieldOfView;
  camera.position.copy(responsiveView.position);
  camera.updateProjectionMatrix();
  controls.target.copy(responsiveView.target);
  controls.update();
  carouselGroup.position.y=getResponsiveCarouselHeight();
  updateProductLabelPosition();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
  );
});

</script>
</body>
